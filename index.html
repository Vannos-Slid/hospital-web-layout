<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Web</title>

    <link rel="stylesheet" href="./css/main.css">
</head>

<body>

    <header class="header">

        <nav class="header-row">

            <div class="row container">
                <a href="#!" class="header-logo">
                    <img src="./imgs/logo.png" srcset="./imgs/logo@2x.png 2x" alt="">
                </a>

                <ul class="header-nav">
                    <li><a href="#!">Home</a></li>
                    <li><a href="#!">Shop</a></li>
                    <li><a href="#!">Pages</a></li>
                    <li><a href="#!">About</a></li>
                    <li><a href="#!">Contact</a></li>
                </ul>

                <div class="header-icons">
                    <a href="#!" class="search"><img class="search-img" src="./imgs/search-icon.svg" alt=""></a>
                    <a href="#!" class="cart"><img src="./imgs/cart-icon.svg" alt="" class="cart-img"></a>
                </div>
            </div>

        </nav>

        <div class="container">

            <div class="header-inner">

                <div class="header-inner-left">
                    <div class="header-inner-left-text">
                        <h1>Your trusted care now and always</h1>
                        <p>For the best results, align your health needs with your medication plan.</p>
                    </div>

                    <div class="header-btn-wrapper">
                        <a href="#!" class="button">
                            <div class="button-content">
                                <img src="./imgs/bag-icon.svg" alt="">
                                <p>Shop now</p>
                            </div>
                        </a>
                    </div>
                </div>

                <div class="header-inner-img">
                    <img src="./imgs/header/pills.png" srcset="./imgs/header/pills@2x.png 2x" alt="pills img png">
                </div>

            </div>

            <div class="header-bg-prop">
                <img src="./imgs/header/bg-prop-2.svg" alt="" class="header-bg-prop-img">
            </div>

        </div>

    </header>

</body>

</html>
