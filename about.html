<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Web</title>

    <link rel="stylesheet" href="./css/main.css">
</head>

<body>

    <header class="header">

        <nav id="header-section-nav-2" class="header-section-nav">

            <div class="row container">
                <a href="#!" class="header-logo">
                    <img src="./imgs/logo.png" srcset="./imgs/logo@2x.png 2x" alt="">
                </a>

                <ul class="header-nav">
                    <li><a href="./index.html">Home</a></li>
                    <li><a href="#!">Shop</a></li>
                    <li id="pages">Pages <img src="./imgs/header/dropdown-arrow.svg" alt=""></li>
                    <li><a href="./about.html">About</a></li>
                    <li><a href="#!">Contact</a></li>
                </ul>

                <div class="header-icons">
                    <a href="#!" class="search"><img class="search-img" src="./imgs/header/search-icon.svg" alt=""></a>
                    <a href="#!" class="cart"><img src="./imgs/header/cart-icon.svg" alt="" class="cart-img"></a>
                </div>
            </div>

        </nav>

        <div id="header-section-hero-about" class="header-section-hero">

            <div class="container">

                <div class="section-hero">
                    <h2 id="header-title-about">Health products you can trust service you deserve</h2>

                    <div class="section-hero-imgs">
                        <img src="./imgs/header/falling-pills.jpg" srcset="./imgs/header/falling-pills@2x.jpg 2x"
                            alt="">
                        <img src="./imgs/header/helt-pill-jars.jpg" srcset="./imgs/header/helt-pill-jars@2x.jpg 2x"
                            alt="">
                        <img src="./imgs/header/women-with-pill.jpg" srcset="./imgs/header/women-with-pill@2x.jpg 2x"
                            alt="">
                    </div>
                </div>

                <div class="section-about-us">
                    <h3>About us</h3>
                    <h4>Our focus is on nurturing wellness and empowering health for all ages well being for people
                        worldwide.</h4>
                </div>

                <div class="section-benefits">
                    <div class="section-benefits-grid">
                        <div class="card-benefit">
                            <img src="./imgs/header/truck-fast-icon.svg" alt="">
                            <h5>Free shipping</h5>
                        </div>

                        <div class="card-benefit">
                            <img src="./imgs/header/exchange-dollar-icon.svg" alt="">
                            <h5>Easy refund</h5>
                        </div>

                        <div class="card-benefit">
                            <img src="./imgs/header/headphone-mic-icon.svg" alt="">
                            <h5>Online support</h5>
                        </div>

                        <div class="card-benefit">
                            <img src="./imgs/header/credit-card-icon.svg" alt="">
                            <h5>Fexible payment</h5>
                        </div>
                    </div>
                </div>

            </div>

            <div class=".background-wrapper header-bg-wrapper">
                <img src="./imgs/header/bg-pills-2.svg" id="header-bg-prop-img-2" alt=""
                    class="header-bg-prop-img bg-prop">
            </div>

        </div>

    </header>

</body>

</html>
