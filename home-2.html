<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Web</title>

    <link rel="stylesheet" href="./css/main.css">
</head>

<body>

    <header class="header">

        <nav id="header-section-nav-2" class="header-section-nav">

            <div class="row container">
                <a href="#!" class="header-logo">
                    <img src="./imgs/logo.png" srcset="./imgs/logo@2x.png 2x" alt="">
                </a>

                <ul class="header-nav">
                    <li><a href="#!">Home</a></li>
                    <li><a href="#!">Shop</a></li>
                    <li id="pages">Pages <img src="./imgs/header/dropdown-arrow.svg" alt=""></li>
                    <li><a href="#!">About</a></li>
                    <li><a href="#!">Contact</a></li>
                </ul>

                <div class="header-icons">
                    <a href="#!" class="search"><img class="search-img" src="./imgs/header/search-icon.svg" alt=""></a>
                    <a href="#!" class="cart"><img src="./imgs/header/cart-icon.svg" alt="" class="cart-img"></a>
                </div>
            </div>

        </nav>

        <div id="header-section-hero-2" class="header-section-hero">

            <div class="container">

                <div class="header-inner">

                    <div class="header-inner-left">
                        <div class="header-inner-left-text">
                            <h1>From wellness to care all in one place</h1>

                            <div class="header-inner-left-text-content">
                                <div class="header-inner-img">
                                    <img src="./imgs/header/man-holds-jars.jpg"
                                        srcset="./imgs/header/man-holds-jars@2x.jpg 2x" alt="pills img png">
                                </div>
                                <div class="header-btn-wrapper">
                                    <p>Your health is in good hands with Medifit. We’re here to provide you with a wide
                                        range of
                                        healthcare essentials,
                                        carefully selected.</p>
                                    <a href="#!" class="button">
                                        <div class="button-content">
                                            <img src="./imgs/header/bag-icon.svg" alt="">
                                            <p>Shop now</p>
                                        </div>
                                    </a>
                                </div>
                            </div>

                        </div>

                    </div>

                </div>

            </div>

            <div class=".background-wrapper header-bg-wrapper">
                <img src="./imgs/header/bg-pills.svg" alt="" id="bg-prop-img-2" class="header-bg-prop-img">
            </div>

        </div>

        <div class="section-emblems">

            <div class="section-emblem-container">

                <div class="section-emblem-grid">

                    <img src="./imgs/header/Compnay logo-1.svg" alt="">
                    <img src="./imgs/header/Compnay logo-2.svg" alt="">
                    <img src="./imgs/header/Compnay logo-3.svg" alt="">
                    <img src="./imgs/header/Compnay logo-4.svg" alt="">
                    <img src="./imgs/header/Compnay logo-5.svg" alt="">
                    <img src="./imgs/header/Compnay logo-6.svg" alt="">

                </div>

            </div>

        </div>

    </header>

</body>

</html>
